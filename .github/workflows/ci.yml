name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade, pacote e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      npm_config_strict_ssl: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Executa também o lifecycle `prepare`, provando que um clone limpo compila.
      - name: Instalar a árvore fixada no lockfile
        run: npm ci

      - name: Executar verificações completas
        run: npm run check

      - name: Compilar o artefato distribuível
        run: npm run build

      - name: Validar entrypoint e versão compilada
        run: |
          npm start -- --help
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const manifest = JSON.parse(await readFile('package.json', 'utf8')); const { SERVER_INFO } = await import('./dist/src/server/createServer.js'); if (SERVER_INFO.version !== manifest.version) throw new Error('SERVER_INFO e package.json possuem versões diferentes');"

      - name: Inspecionar conteúdo do pacote sem criar arquivo
        run: npm pack --dry-run --ignore-scripts

      - name: Criar uma única vez o pacote testado pelo CI
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_FILE="$(npm pack --ignore-scripts --json | node --input-type=module -e 'let source = ""; for await (const chunk of process.stdin) source += chunk; process.stdout.write(JSON.parse(source)[0].filename);')"
          test "$PACKAGE_FILE" = "mcp-server-efi-$VERSION.tgz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> "$GITHUB_ENV"
          sha256sum "$PACKAGE_FILE" > ci-package.sha256

      - name: Executar o binário do pacote exato
        shell: bash
        run: |
          INSTALL_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_DIR"' EXIT
          npm install --prefix "$INSTALL_DIR" "./$PACKAGE_FILE" --ignore-scripts --no-audit --no-fund
          "$INSTALL_DIR/node_modules/.bin/mcp-server-efi" --help
          sha256sum --check ci-package.sha256

      - name: Auditar árvore de desenvolvimento
        run: npm audit --audit-level=low

      - name: Auditar o mesmo pacote como consumidor
        run: npm run audit:artifact -- "./$PACKAGE_FILE"

      - name: Gerar e validar bundle MCPB 0.3
        run: |
          npm run mcpb:pack
          MCPB_FILE="mcp-server-efi-$VERSION.mcpb"
          unzip -l "$MCPB_FILE" | grep -F 'manifest.json'
          unzip -l "$MCPB_FILE" | grep -F 'dist/src/index.js'
          unzip -l "$MCPB_FILE" | grep -F 'node_modules/'

  docker:
    name: Imagem Docker sem root
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Construir imagem multi-stage
        run: docker build --build-arg VERSION="${{ needs.quality.outputs.version }}" --tag mcp-server-efi:test .

      - name: Confirmar usuário final não-root
        run: test "$(docker image inspect mcp-server-efi:test --format '{{.Config.User}}')" = node

      - name: Confirmar versão da imagem
        run: test "$(docker image inspect mcp-server-efi:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "${{ needs.quality.outputs.version }}"

      - name: Executar entrypoint da imagem
        run: docker run --rm mcp-server-efi:test --help

      - name: Confirmar imagem mínima sem gerenciadores de pacotes
        run: docker run --rm --entrypoint sh mcp-server-efi:test -c 'test ! -e /usr/local/bin/npm && test ! -e /usr/local/lib/node_modules/npm && test ! -e /usr/local/bin/corepack && test ! -e /usr/local/bin/yarn'

      - name: Gerar SBOM SPDX da imagem
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mcp-server-efi:test
          format: spdx-json
          artifact-name: mcp-server-efi-image.spdx.json

      - name: Bloquear vulnerabilidades altas ou críticas na imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-server-efi:test
          version: v0.72.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
