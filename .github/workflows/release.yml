name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_TLS_REJECT_UNAUTHORIZED: '1'
  npm_config_strict_ssl: 'true'
  IMAGE: ghcr.io/efipay/mcp-server-efi
  SBOM_FILE: mcp-server-efi-image.spdx.json

jobs:
  preflight:
    name: Validar tag e produzir artefatos imutáveis
    if: github.repository == 'efipay/mcp-server-efi'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release.outputs.version }}
      package_file: ${{ steps.release.outputs.package_file }}
      mcpb_file: ${{ steps.release.outputs.mcpb_file }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar versão, assinaturas e árvore do espelho pessoal
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-metadata.mjs \
            --tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"
          test -s .github/allowed_signers

          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"

          ORG_VERIFICATION="$(git verify-tag --raw "$GITHUB_REF_NAME" 2>&1)"
          printf '%s\n' "$ORG_VERIFICATION"
          grep -Fq 'joao.muniz@gerencianet.com.br' <<<"$ORG_VERIFICATION"

          PERSONAL_TAG="personal-$GITHUB_REF_NAME"
          git fetch --no-tags https://github.com/JoaoLucasAl/mcp-server-efi.git \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$PERSONAL_TAG"
          PERSONAL_VERIFICATION="$(git verify-tag --raw "$PERSONAL_TAG" 2>&1)"
          printf '%s\n' "$PERSONAL_VERIFICATION"
          grep -Fq 'joaolucas.power@gmail.com' <<<"$PERSONAL_VERIFICATION"

          test "$(git rev-parse "$GITHUB_REF_NAME^{tree}")" = \
            "$(git rev-parse "$PERSONAL_TAG^{tree}")"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Atualizar npm antes de criar qualquer artefato
        run: npm install --global npm@12.0.1

      - name: Instalar e executar todos os gates
        run: |
          npm ci
          npm run check
          npm audit --audit-level=low
          npm pack --dry-run --ignore-scripts

      - name: Criar e validar o pacote e o MCPB uma única vez
        shell: bash
        run: |
          npm run mcpb:pack
          npm pack --ignore-scripts --pack-destination .
          test -f "$PACKAGE_FILE"
          unzip -t "$MCPB_FILE"
          npm run audit:artifact -- "./$PACKAGE_FILE"

          INSTALL_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_DIR"' EXIT
          npm install --prefix "$INSTALL_DIR" "./$PACKAGE_FILE" --ignore-scripts --no-audit --no-fund
          "$INSTALL_DIR/node_modules/.bin/mcp-server-efi" --help

      - name: Construir e validar a imagem que origina o SBOM
        run: |
          docker build --build-arg VERSION="$VERSION" --tag mcp-server-efi:release-preflight .
          test "$(docker image inspect mcp-server-efi:release-preflight --format '{{.Config.User}}')" = node
          test "$(docker image inspect mcp-server-efi:release-preflight --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          docker run --rm mcp-server-efi:release-preflight --help

      - name: Bloquear vulnerabilidades altas ou críticas
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-server-efi:release-preflight
          version: v0.72.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Gerar uma única vez o SBOM SPDX do release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mcp-server-efi:release-preflight
          format: spdx-json
          output-file: mcp-server-efi-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Registrar checksums dos artefatos
        run: sha256sum "$PACKAGE_FILE" "$MCPB_FILE" "$SBOM_FILE" > SHA256SUMS

      - name: Transferir artefatos imutáveis aos jobs de publicação
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ${{ steps.release.outputs.package_file }}
            ${{ steps.release.outputs.mcpb_file }}
            mcp-server-efi-image.spdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-ghcr:
    name: Publicar e promover o mesmo digest no GHCR
    if: github.repository == 'efipay/mcp-server-efi'
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Conferir artefatos transferidos
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publicar por tag temporária do commit
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: VERSION=${{ needs.preflight.outputs.version }}
          provenance: mode=max

      - name: Escanear exatamente o digest publicado
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.72.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Promover o mesmo digest para a versão e latest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          test "sha256:$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | sha256sum | cut -d ' ' -f 1)" = "$DIGEST"
          test "sha256:$(docker buildx imagetools inspect "$IMAGE:latest" --raw | sha256sum | cut -d ' ' -f 1)" = "$DIGEST"

  publish-npm:
    name: Publicar o .tgz auditado no npm
    if: github.repository == 'efipay/mcp-server-efi'
    needs: [preflight, publish-ghcr]
    permissions:
      id-token: write
    environment: production
    env:
      PACKAGE_FILE: ${{ needs.preflight.outputs.package_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts

      - name: Conferir os artefatos recebidos
        run: sha256sum --check SHA256SUMS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Atualizar npm para Trusted Publishing
        run: npm install --global npm@12.0.1

      - name: Publicar exatamente o pacote auditado
        run: npm publish "./$PACKAGE_FILE" --access public --provenance

  publish-smithery:
    name: Publicar o MCPB no Smithery
    if: github.repository == 'efipay/mcp-server-efi'
    needs: [preflight, publish-npm]
    permissions: {}
    env:
      MCPB_FILE: ${{ needs.preflight.outputs.mcpb_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts

      - name: Conferir os artefatos recebidos
        run: sha256sum --check SHA256SUMS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Publicar bundle local no Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: npx --yes smithery@1.2.0 mcp publish "./$MCPB_FILE" -n efipay/mcp-server-efi

  github-release:
    name: Criar GitHub Release após todos os canais
    if: github.repository == 'efipay/mcp-server-efi'
    needs: [preflight, publish-ghcr, publish-npm, publish-smithery]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PACKAGE_FILE: ${{ needs.preflight.outputs.package_file }}
      MCPB_FILE: ${{ needs.preflight.outputs.mcpb_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Conferir anexos do release
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Criar GitHub Release definitivo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-artifacts/$PACKAGE_FILE" \
            "release-artifacts/$MCPB_FILE" \
            "release-artifacts/$SBOM_FILE" \
            "release-artifacts/SHA256SUMS" \
            --verify-tag \
            --title "mcp-server-efi $VERSION" \
            --notes-file CHANGELOG.md
